version: "3.8"

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - ./Backend/.env
    volumes:
      - ./Backend:/src
      - /src/node_modules
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/src
      - /src/node_modules
    restart: unless-stopped
